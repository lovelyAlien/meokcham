spring:
  application:
    name: meokcham
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meokcham}
    username: ${DB_USERNAME:meokcham}
    password: ${DB_PASSWORD:meokcham}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
